spring:
  cloud:
    inetutils:
      ignored-interfaces:
        - vEthernet.*
        - WSL.*
      default-hostname: localhost
      default-ip-address: 127.0.0.1
  datasource:
    url: jdbc:postgresql://localhost:5432/order
    username: kalidas
    password: kalidas@123
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST_URL:localhost}
    port: ${RABBITMQ_HOST_PORT:5672}
    username: ${RABBITMQ_HOST_USERNAME:guest}
    password: ${RABBITMQ_HOST_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:guest}
    connection-timeout: 30000
    exchange:
      name: order.exchange
    queue:
      name: order.queue
    routing:
      key: order.tracking
