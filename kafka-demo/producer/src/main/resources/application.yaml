spring:
  integration:
    poller:
      fixed-delay: 5000
  application:
    name: producer
  cloud:
    function:
      definition: sendRiderLocation
    stream:
      function:
        definition: sendRiderLocation  # <--- MUST MATCH THE BEAN NAME
      bindings:
        sendRiderLocation-out-0:
          destination: rider-location-topic
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

